server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:file:.env[.properties]"
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 10s
          default-filters:
            - name: Retry
              args:
                retries: 3
                methods: GET
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 4s
                  factor: 2
                  basedOnPreviousValue: false
          routes:
            - id: loginApi
              uri: ${LOGIN_URL:http://localhost:8090}
              predicates:
                - Path=/api/auth/**

            - id: calendarioApi
              uri: ${CALENDARIO_URL:http://localhost:8092}
              predicates:
                - Path=/api/servicos/*/horarios, /api/calendario/**

            - id: agendamentoApi
              uri: ${AGENDAMENTO_URL:http://localhost:8091}
              predicates:
                - Path=/api/servicos/**, /api/agendamentos/**

            - id: relatorioApi
              uri: ${RELATORIO_URL:http://localhost:8093}
              predicates:
                - Path=/api/relatorio/**

jwt:
  secret: ${JWT_SECRET}

cookie:
  nome: ${COOKIE_NOME:tokenAgendaFlow}

cors:
  origens:
    - "http://localhost:8081"
    - "http://localhost:19006"
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:8081"
    - "http://127.0.0.1:5500"